version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gestion-tutorias-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_tutorias
      MYSQL_USER: tutorias_user
      MYSQL_PASSWORD: tutorias_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - tutorias-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion-tutorias-backend
    environment:
      # Activar el perfil Docker
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tutorias-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/dashboard/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  mysql_data:
    driver: local

networks:
  tutorias-network:
    driver: bridge
