# H2 Configuration para Testing
# Usar H2 base de datos en memoria para tests rápidos y sin dependencias externas

# URL de conexión H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL

# Driver de H2
spring.datasource.driverClassName=org.h2.Driver

# Nombre de usuario H2 (por defecto)
spring.datasource.username=sa
spring.datasource.password=

# Configuración de Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crear el schema automáticamente en memoria
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar SQL en logs (útil para debugging de tests)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 console para debuggear si es necesario
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Desabilitar validaciones de base de datos (para tests más rápidos)
spring.datasource.hikari.maximum-pool-size=2

# Configuración de logging para tests
logging.level.com.universidad.tutorias=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
