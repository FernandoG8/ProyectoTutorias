# ============================================
# application-dev.properties
# ============================================

# Server
server.port=8080

# ============================================
# DATABASE (LOCAL)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_tutorias?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Fernan
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================
# LOGGING (VERBOSO PARA DEV)
# ============================================
logging.level.root=INFO
logging.level.com.universidad.tutorias=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# SECURITY / JWT (DEV)
# ============================================
security.jwt.secret=dW5pdmVyc2lkYWRUdXRvcmlhc1NlZ3VyaWRhQWNjZXNvMjAyNA==
security.jwt.expiration=3600
security.jwt.refresh-expiration=604800
security.jwt.issuer=ProyectoTutorias

security.jwt.access-cookie-name=tutorias_access_token
security.jwt.refresh-cookie-name=tutorias_refresh_token
security.jwt.cookie-secure=false
security.jwt.cookie-same-site=lax
security.jwt.cookie-path=/
security.jwt.cookie-domain=

# Clave simétrica para cifrado local (base64, 256 bits)
app.crypto.key=${APP_CRYPTO_KEY:SbHfcmqAj5MYc/wLkcNyL0eOEh6dFwwFVWh1kmlN2d4=}

# ============================================
# CORS (DEV)
# ============================================
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# ============================================
# OAUTH2 GOOGLE (DEV)
# ============================================
app.oauth2.success-redirect=http://localhost:5173/
app.oauth2.failure-redirect=http://localhost:5173/login?error=google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${GOOGLE_OAUTH_CLIENT_ID:dev-client-id}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:${GOOGLE_OAUTH_CLIENT_SECRET:dev-client-secret}}


# ============================================
# DEFAULT USERS (DEV)
# ============================================
app.security.default-coordinator.username=coord_tutorias
app.security.default-coordinator.password=123456

# Google scopes
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/drive

# Shared Drive
app.drive.shared-drive-name=Tutolink Reportes


logging.level.org.springframework.core.env=DEBUG

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

