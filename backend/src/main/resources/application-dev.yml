spring:
  application:
    name: ProyectoTutoriasBackend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gestion_tutorias?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Fernan}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  drive:
    shared-drive-name: Tutolink Reportes
  oauth2:
    success-redirect: http://localhost:5173/
    failure-redirect: http://localhost:5173/login?error=google
  crypto:
    key: ${APP_CRYPTO_KEY:SbHfcmqAj5MYc/wLkcNyL0eOEh6dFwwFVWh1kmlN2d4=}

security:
  jwt:
    secret: ${JWT_SECRET:dW5pdmVyc2lkYWRUdXRvcmlhc1NlZ3VyaWRhQWNjZXNvMjAyNA==}
    expiration: 3600
    refresh-expiration: 604800
    issuer: ProyectoTutorias
    access-cookie-name: tutorias_access_token
    refresh-cookie-name: tutorias_refresh_token
    cookie-secure: false
    cookie-same-site: lax
    cookie-path: /
    cookie-domain: ""

logging:
  level:
    root: INFO
    com.universidad.tutorias: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
