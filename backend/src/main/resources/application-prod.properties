# ============================================
# application-prod.properties
# ============================================

# Server
server.port=${PORT:8080}

# ============================================
# DATABASE (PRODUCCIÓN)
# ============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

# ============================================
# LOGGING (CONTROLADO)
# ============================================
logging.level.root=INFO
logging.level.com.universidad.tutorias=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# SECURITY / JWT (PROD)
# ============================================
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=3600
security.jwt.refresh-expiration=604800
security.jwt.issuer=ProyectoTutorias

security.jwt.access-cookie-name=tutorias_access_token
security.jwt.refresh-cookie-name=tutorias_refresh_token
security.jwt.cookie-secure=true
security.jwt.cookie-same-site=none
security.jwt.cookie-path=/
security.jwt.cookie-domain=${COOKIE_DOMAIN:}

# ============================================
# JPA / FLYWAY (PROD DEMO)
# ============================================
# BD ya restaurada en JawsDB: validar esquema en prod (recomendado)
# Si la validación falla y necesitas arrancar para demo: cambia a 'update'
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

# ============================================
# CORS (PROD)
# ============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ============================================
# DEFAULT USERS (DESACTIVAR EN PROD)
# ====================

# ============================================
# OAUTH2 GOOGLE (PROD)
# ============================================
app.oauth2.success-redirect=${OAUTH2_SUCCESS_REDIRECT:https://tu-frontend.vercel.app/}
app.oauth2.failure-redirect=${OAUTH2_FAILURE_REDIRECT:https://tu-frontend.vercel.app/login?error=google}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Google scopes
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/drive

# Shared Drive
app.drive.shared-drive-name=Tutolink Reportes

# ============================================
# CRYPTO (PROD)
# ============================================
app.crypto.key=${APP_CRYPTO_KEY}
