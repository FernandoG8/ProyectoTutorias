spring:
  application:
    name: ProyectoTutoriasBackend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://db:5432/postgres}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # En contenedores/prod con una BD vacía, permitir que Hibernate cree/actualice el esquema.
      # Si agregas migraciones Flyway específicas para PostgreSQL, vuelve a 'validate'.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Deshabilitado en prod hasta contar con scripts PostgreSQL en db/migration/postgresql
    enabled: false
    locations: classpath:db/migration/postgresql

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-frontend.vercel.app}
  drive:
    shared-drive-name: Tutolink Reportes
  oauth2:
    success-redirect: https://your-frontend.vercel.app/
    failure-redirect: https://your-frontend.vercel.app/login?error=google
  crypto:
    key: ${APP_CRYPTO_KEY}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600
    refresh-expiration: 604800
    issuer: ProyectoTutorias
    access-cookie-name: tutorias_access_token
    refresh-cookie-name: tutorias_refresh_token
    cookie-secure: true
    cookie-same-site: none
    cookie-path: /
    cookie-domain: ${COOKIE_DOMAIN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.universidad.tutorias: INFO
