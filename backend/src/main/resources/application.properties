# ============================================
# application.properties
# ============================================
spring.application.name=ProyectoTutoriasBackend

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_tutorias?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Fernan
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ============================================
# MULTIPART FILE UPLOAD
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.universidad.tutorias=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# ASYNC CONFIGURATION
# ============================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# ============================================
# JACKSON CONFIGURATION
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================
# ACTUATOR (Opcional - para monitoreo)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# ============================================
# SECURITY CONFIGURATION
# ============================================
security.jwt.secret=dW5pdmVyc2lkYWRUdXRvcmlhc1NlZ3VyaWRhQWNjZXNvMjAyNA==
security.jwt.expiration=3600
security.jwt.refresh-expiration=604800
security.jwt.issuer=ProyectoTutorias
security.jwt.access-cookie-name=tutorias_access_token
security.jwt.refresh-cookie-name=tutorias_refresh_token
security.jwt.cookie-secure=false
security.jwt.cookie-same-site=Lax
security.jwt.cookie-path=/
security.jwt.cookie-domain=

# ============================================
# CORS CONFIGURATION
# ============================================
# IMPORTANTE: Incluir TODOS los puertos donde corre el frontend
app.cors.allowed-origins=http://localhost:5175,http://localhost:5173,http://localhost:3000

# ============================================
# DEFAULT USERS
# ============================================
app.security.default-coordinator.username=coord_tutorias
app.security.default-coordinator.password=123456